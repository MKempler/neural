<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#16181d">
  <title>Claude Hub</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Claude Hub</h1>
      <span id="conn" class="dot off" title="Disconnected"></span>
    </header>
    <nav id="sessions" aria-label="Sessions"></nav>
    <footer>
      <button id="new-btn" class="primary">New session</button>
      <button id="search-btn">Search history</button>
      <button id="notify-btn" hidden>Turn on notifications</button>
    </footer>
  </aside>

  <main>
    <header id="topbar">
      <button id="menu-btn" aria-label="Sessions">Sessions<span id="menu-badge" class="badge" hidden></span></button>
      <div id="title">
        <strong id="title-name"></strong>
        <span id="title-status"></span>
      </div>
      <div id="actions">
        <button id="term-btn">Terminal</button>
        <button id="restart-btn">Restart</button>
        <button id="stop-btn">Stop</button>
      </div>
    </header>

    <div id="notice" hidden></div>
    <div id="permissions"></div>

    <section id="terminal" hidden>
      <div id="xterm" hidden></div>
      <pre id="screen" tabindex="0"></pre>
      <div id="keys">
        <button id="history-btn" hidden>History</button>
        <button data-key="Enter">Enter</button>
        <button data-key="Escape">Esc</button>
        <button data-key="Up">Up</button>
        <button data-key="Down">Down</button>
        <button data-key="Tab">Tab</button>
        <button data-key="BTab">Shift+Tab</button>
        <button data-key="y">y</button>
        <button data-key="n">n</button>
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="C-c">Ctrl+C</button>
        <form id="type-form"><input id="type-input" placeholder="Type into the terminal" autocomplete="off" autocapitalize="off"><button>Type</button></form>
      </div>
    </section>

    <section id="thread" aria-live="polite"></section>

    <section id="search" hidden>
      <form id="search-form">
        <input id="search-input" type="search" placeholder="Search every message and transcript" autocomplete="off">
        <button class="primary">Search</button>
      </form>
      <div id="search-results"></div>
    </section>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <button class="primary" id="send-btn">Send</button>
    </form>
  </main>

  <dialog id="new-dialog">
    <form method="dialog" id="new-form">
      <h2>New session</h2>
      <label>Name <input name="name" required pattern="[a-z0-9][a-z0-9_\-]{0,31}" placeholder="api" autocapitalize="off" autocomplete="off"></label>
      <label>Working directory <input name="cwd" required placeholder="/Users/you/project" autocapitalize="off" autocomplete="off"></label>
      <label>First message (optional) <textarea name="prompt" rows="3"></textarea></label>
      <p id="new-error" class="error" hidden></p>
      <menu>
        <button type="button" id="new-cancel">Cancel</button>
        <button class="primary" value="create">Start</button>
      </menu>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
